[project]
name = "zeoatap-vision"
version = "0.1.0"
description = "Camera ingest, health checks and evidence ring buffer for the Zeoatap edge appliance"
requires-python = ">=3.12"
dependencies = [
  "av>=14.0,<16",
  "numpy>=2.0,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "jsonschema>=4.23",
]

[project.scripts]
zeoatap-vision = "zeoatap_vision.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeoatap_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
