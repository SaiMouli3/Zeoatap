[project]
name = "zeoatap-eval"
version = "0.1.0"
description = "Event-level safety evaluation harness (SAFETY_VALIDATION §4-§7)"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.3.4",
  "scipy==1.16.3",
  "jsonschema==4.25.1",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[project.scripts]
zeoatap-eval = "zeoatap_eval.__main__:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeoatap_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
